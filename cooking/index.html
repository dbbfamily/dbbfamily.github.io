<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitchenOps</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101514;
    --panel: #1a2120;
    --panel-2: #22302e;
    --line: #34423f;
    --text: #edf4ef;
    --muted: #9fb0a9;
    --accent: #72c7ba;
    --accent-soft: #193531;
    --green: #b9d77c;
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.55;
  }

  button, input, select { font: inherit; }
  h1, h2, h3 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    line-height: 1.1;
  }

  .masthead {
    padding: 2.5rem 1.25rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: #17201e;
  }

  .masthead-inner,
  .layout,
  .footer {
    width: min(1120px, 100%);
    margin: 0 auto;
  }

  .masthead-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.5rem;
    align-items: end;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    letter-spacing: 0;
  }

  .masthead p {
    margin: 0.55rem 0 0;
    color: var(--muted);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(84px, 1fr));
    gap: 0.5rem;
    min-width: 310px;
  }

  .stat,
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
  }

  .stat {
    padding: 0.7rem 0.85rem;
  }

  .stat b {
    display: block;
    color: var(--accent);
    font-size: 1.15rem;
  }

  .stat span,
  .subtitle,
  .empty {
    color: var(--muted);
  }

  .stat span { font-size: 0.74rem; }

  .nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 0.45rem;
    padding: 0.8rem max(1rem, calc((100vw - 1120px) / 2));
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    background: rgba(26, 33, 32, 0.96);
    backdrop-filter: blur(12px);
  }

  .nav button,
  .chip,
  .back-btn,
  .icon-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
  }

  .nav button {
    padding: 0.55rem 0.95rem;
    white-space: nowrap;
    font-weight: 500;
    font-size: 0.88rem;
  }

  .nav button:hover,
  .chip:hover,
  .back-btn:hover,
  .icon-btn:hover {
    border-color: var(--muted);
    color: var(--text);
  }

  .nav button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #071513;
  }

  .layout {
    padding: 1.25rem;
  }

  .tools {
    display: grid;
    grid-template-columns: 1fr 170px 170px;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .tools input,
  .tools select {
    width: 100%;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    padding: 0 0.85rem;
    outline: none;
  }

  .recipe-grid,
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 0.85rem;
  }

  .card {
    padding: 1rem;
  }

  .recipe-card {
    cursor: pointer;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .recipe-card:hover { background: var(--panel-2); }
  .recipe-card h2, .info-card h2 { font-size: 1.2rem; }

  .subtitle {
    margin: 0;
    font-size: 0.9rem;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .spec,
  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 0.22rem 0.58rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #a7ded6;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .chip {
    background: transparent;
    padding: 0.3rem 0.7rem;
  }

  .detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 1rem;
    align-items: start;
  }

  .detail-main,
  .detail-side {
    display: grid;
    gap: 1rem;
  }

  .recipe-title {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .back-btn {
    width: fit-content;
    padding: 0.42rem 0.8rem;
    margin-bottom: 0.8rem;
    font-size: 0.82rem;
  }

  .section-label {
    margin-bottom: 0.65rem;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .servings {
    display: grid;
    grid-template-columns: 36px 1fr 36px;
    gap: 0.5rem;
    align-items: center;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 1.15rem;
    color: var(--accent);
  }

  .servings strong {
    display: block;
    text-align: center;
    color: var(--accent);
    font-size: 1.05rem;
  }

  .ingredients,
  .steps {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .ingredients li,
  .steps li {
    border-top: 1px solid var(--line);
    padding: 0.62rem 0;
  }

  .ingredients li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
  }

  .amount {
    color: #a7ded6;
    white-space: nowrap;
    font-weight: 500;
  }

  .fixed {
    display: block;
    color: var(--muted);
    font-size: 0.7rem;
    text-align: right;
    font-weight: 300;
  }

  .steps li {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 0.75rem;
  }

  .step-no {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #071513;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 0.82rem;
  }

  .step-body b {
    display: block;
    margin-bottom: 0.15rem;
  }

  .timer {
    color: var(--green);
    font-size: 0.78rem;
    margin-left: 0.35rem;
  }

  .empty {
    padding: 3rem 1rem;
    text-align: center;
  }

  .footer {
    padding: 1.2rem 1.25rem 2rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.78rem;
  }

  @media (max-width: 820px) {
    .masthead-inner,
    .detail,
    .tools {
      grid-template-columns: 1fr;
    }

    .stats { min-width: 0; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div>
      <h1>KitchenOps</h1>
      <p>A practical cooking system for recipes, techniques, and weeknight decisions.</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<nav class="nav" id="nav"></nav>
<main class="layout" id="content"><div class="empty">Loading KitchenOps...</div></main>
<footer class="footer">KitchenOps public export.</footer>

<script>
const DATA = {
  manifest: 'data/manifest.yaml',
  recipes: 'data/recipes.yaml',
  techniques: 'data/techniques.yaml',
  skills: 'data/skills.yaml',
};

const SECTIONS = {
  recipes: 'Recipes',
  techniques: 'Techniques',
  skills: 'Skills',
};

let state = {
  manifest: null,
  recipes: [],
  techniques: [],
  skills: [],
  active: 'recipes',
  openRecipeId: null,
  servingsById: {},
  filters: { q: '', category: 'all', appliance: 'all' },
};

const escapeHtml = value => String(value ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

async function loadYaml(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Could not load ${url}`);
  return jsyaml.load(await response.text());
}

async function loadAll() {
  const [manifest, recipes, techniques, skills] = await Promise.all([
    loadYaml(DATA.manifest),
    loadYaml(DATA.recipes),
    loadYaml(DATA.techniques),
    loadYaml(DATA.skills),
  ]);
  state.manifest = manifest;
  state.recipes = recipes.recipes || [];
  state.techniques = techniques.techniques || [];
  state.skills = skills.skills || [];
  state.recipes.forEach(recipe => { state.servingsById[recipe.id] = recipe.base_servings || 4; });
  routeFromHash();
  render();
}

function routeFromHash() {
  const raw = decodeURIComponent(window.location.hash.replace(/^#/, ''));
  if (!raw) return;
  const [section, id] = raw.split('/');
  if (SECTIONS[section]) state.active = section;
  if (section === 'recipes' && state.recipes.some(recipe => recipe.id === id)) state.openRecipeId = id;
}

function setHash() {
  window.location.hash = state.openRecipeId ? `recipes/${state.openRecipeId}` : state.active;
}

function render() {
  renderStats();
  renderNav();
  if (state.active === 'recipes') renderRecipes();
  if (state.active === 'techniques') renderInfo('techniques', state.techniques);
  if (state.active === 'skills') renderInfo('skills', state.skills);
}

function renderStats() {
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${state.recipes.length}</b><span>recipes</span></div>
    <div class="stat"><b>${state.techniques.length}</b><span>techniques</span></div>
    <div class="stat"><b>${state.skills.length}</b><span>skills</span></div>
  `;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = Object.entries(SECTIONS).map(([key, label]) =>
    `<button data-section="${key}" class="${state.active === key ? 'active' : ''}">${label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      state.active = button.dataset.section;
      state.openRecipeId = null;
      setHash();
      render();
    });
  });
}

function renderRecipes() {
  document.getElementById('content').innerHTML = state.openRecipeId
    ? renderRecipeDetail(state.recipes.find(recipe => recipe.id === state.openRecipeId))
    : renderRecipeList();
  wireRecipes();
}

function uniqueRecipeValues(key) {
  return [...new Set(state.recipes.map(recipe => recipe[key]).filter(Boolean))].sort();
}

function recipeMatches(recipe) {
  const haystack = [
    recipe.title,
    recipe.description,
    recipe.category,
    recipe.method,
    recipe.appliance,
    ...(recipe.ingredients || []).map(ingredient => ingredient.name),
  ].join(' ').toLowerCase();
  return (!state.filters.q || haystack.includes(state.filters.q))
    && (state.filters.category === 'all' || recipe.category === state.filters.category)
    && (state.filters.appliance === 'all' || recipe.appliance === state.filters.appliance);
}

function renderRecipeList() {
  const categories = uniqueRecipeValues('category');
  const appliances = uniqueRecipeValues('appliance');
  const filtered = state.recipes.filter(recipeMatches);
  return `
    <div class="tools">
      <input id="recipeSearch" type="search" placeholder="Search recipes, ingredients, methods..." value="${escapeHtml(state.filters.q)}">
      <select id="categoryFilter">
        <option value="all">All categories</option>
        ${categories.map(value => `<option value="${escapeHtml(value)}" ${state.filters.category === value ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('')}
      </select>
      <select id="applianceFilter">
        <option value="all">All appliances</option>
        ${appliances.map(value => `<option value="${escapeHtml(value)}" ${state.filters.appliance === value ? 'selected' : ''}>${escapeHtml(value)}</option>`).join('')}
      </select>
    </div>
    <div class="recipe-grid">${filtered.map(renderRecipeCard).join('') || '<div class="empty">No matching recipes.</div>'}</div>
  `;
}

function renderRecipeCard(recipe) {
  const specs = [recipe.category, recipe.appliance, recipe.method, recipe.base_servings ? `serves ${recipe.base_servings}` : ''].filter(Boolean);
  return `
    <article class="card recipe-card" data-open="${escapeHtml(recipe.id)}">
      <h2>${escapeHtml(recipe.title)}</h2>
      <div class="meta">${specs.map(spec => `<span class="spec">${escapeHtml(spec)}</span>`).join('')}</div>
      <p class="subtitle">${escapeHtml(recipe.description || '')}</p>
    </article>
  `;
}

function renderRecipeDetail(recipe) {
  if (!recipe) return '<div class="empty">Recipe not found.</div>';
  const servings = state.servingsById[recipe.id] || recipe.base_servings || 4;
  const factor = servings / (recipe.base_servings || 4);
  const specs = [recipe.category, recipe.appliance, recipe.method].filter(Boolean);
  return `
    <button class="back-btn" id="recipeBack">All recipes</button>
    <div class="detail">
      <div class="detail-main">
        <section class="card recipe-title">
          <h2>${escapeHtml(recipe.title)}</h2>
          <div class="meta">${specs.map(spec => `<span class="spec">${escapeHtml(spec)}</span>`).join('')}</div>
          <p class="subtitle">${escapeHtml(recipe.description || '')}</p>
        </section>
        <section class="card">
          <div class="section-label">Method</div>
          <ol class="steps">${(recipe.steps || []).map(renderStep).join('')}</ol>
        </section>
      </div>
      <aside class="detail-side">
        <section class="card">
          <div class="section-label">Servings</div>
          <div class="servings">
            <button class="icon-btn" data-step="-1" aria-label="Decrease servings">-</button>
            <strong>Serves ${servings}</strong>
            <button class="icon-btn" data-step="1" aria-label="Increase servings">+</button>
          </div>
        </section>
        <section class="card">
          <div class="section-label">Ingredients</div>
          <ul class="ingredients">${(recipe.ingredients || []).map(ingredient => renderIngredient(ingredient, factor)).join('')}</ul>
        </section>
      </aside>
    </div>
  `;
}

function renderIngredient(ingredient, factor) {
  const hasAmount = typeof ingredient.amount === 'number';
  const scales = ingredient.scales !== false && hasAmount;
  let amount = '';
  if (hasAmount) {
    const value = scales ? ingredient.amount * factor : ingredient.amount;
    const rounded = Math.round(value * 10) / 10;
    amount = `${Number.isInteger(rounded) ? rounded : rounded.toFixed(1)}${ingredient.unit ? ` ${ingredient.unit}` : ''}`;
  }
  return `<li><span>${escapeHtml(ingredient.name)}</span><span class="amount">${escapeHtml(amount)}${hasAmount && !scales ? '<span class="fixed">fixed</span>' : ''}</span></li>`;
}

function renderStep(step, index) {
  const minutes = step.timer_seconds ? Math.round(step.timer_seconds / 60) : null;
  return `
    <li>
      <span class="step-no">${index + 1}</span>
      <span class="step-body">
        <b>${escapeHtml(step.title || '')}${minutes ? `<span class="timer">${minutes} min</span>` : ''}</b>
        ${escapeHtml(step.content || '')}
      </span>
    </li>
  `;
}

function renderInfo(kind, items) {
  document.getElementById('content').innerHTML = `
    <div class="info-grid">
      ${items.map(item => `
        <article class="card info-card">
          <h2>${escapeHtml(item.title)}</h2>
          <p class="subtitle">${escapeHtml(item.summary || '')}</p>
        </article>
      `).join('')}
    </div>
  `;
}

function wireRecipes() {
  const search = document.getElementById('recipeSearch');
  const category = document.getElementById('categoryFilter');
  const appliance = document.getElementById('applianceFilter');
  if (search) search.addEventListener('input', () => {
    state.filters.q = search.value.toLowerCase().trim();
    renderRecipes();
    const next = document.getElementById('recipeSearch');
    if (next) {
      next.focus();
      next.setSelectionRange(next.value.length, next.value.length);
    }
  });
  if (category) category.addEventListener('change', () => {
    state.filters.category = category.value;
    renderRecipes();
  });
  if (appliance) appliance.addEventListener('change', () => {
    state.filters.appliance = appliance.value;
    renderRecipes();
  });
  document.querySelectorAll('[data-open]').forEach(element => {
    element.addEventListener('click', () => {
      state.openRecipeId = element.dataset.open;
      setHash();
      renderRecipes();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  const back = document.getElementById('recipeBack');
  if (back) back.addEventListener('click', () => {
    state.openRecipeId = null;
    setHash();
    renderRecipes();
  });
  document.querySelectorAll('[data-step]').forEach(button => {
    button.addEventListener('click', () => {
      const current = state.servingsById[state.openRecipeId] || 4;
      state.servingsById[state.openRecipeId] = Math.max(1, current + Number(button.dataset.step));
      renderRecipes();
    });
  });
}

window.addEventListener('hashchange', () => {
  routeFromHash();
  render();
});

loadAll().catch(error => {
  document.getElementById('content').innerHTML = `<div class="empty">Could not load KitchenOps: ${escapeHtml(error.message)}</div>`;
});
</script>
</body>
</html>
